[package]
name = "trae-work-assistant"
version = "2.4.8"
description = "Trae Work 助手 - 多账号签到与管理桌面端"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [ "tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
ureq = { version = "2", features = ["json"] }
urlencoding = "2"
axum = "0.7"
tokio = { version = "1", features = ["sync", "io-util", "net", "rt", "macros", "time", "process"] }
tokio-stream = "0.1"
bytes = "1"
sha2 = "0.10"
rsa = { version = "0.9", features = ["pem", "sha2"] }
rcgen = "0.13"
time = "0.3"
uuid = { version = "1", features = ["v4"] }
winreg = "0.52"
chromiumoxide = { version = "0.7", default-features = false, features = ["tokio-runtime"] }
futures = "0.3"
rusqlite = { version = "0.31", features = ["bundled"] }
scrypt = { version = "0.11", default-features = false }
aes-gcm = "0.10"
flate2 = "1.0"
tar = "0.4"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
hmac = "0.12"
pbkdf2 = { version = "0.12", default-features = false }
hex = "0.4"
winapi = { version = "0.3", features = ["tlhelp32", "processthreadsapi", "memoryapi", "winnt", "handleapi", "minwindef"] }
rand = "0.8"
md-5 = "0.10"

[features]
# 仅桌面端
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
