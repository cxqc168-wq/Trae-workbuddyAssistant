name: Release Windows

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python (build-time resource preparation)
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Test Python helpers
        run: python src-python/tests/test_auto_checkin.py

      - name: Prepare complete runtime resources
        run: npm run release:prepare

      - name: Test Rust backend
        working-directory: src-tauri
        run: cargo test --locked

      - name: Build Tauri app (NSIS + MSI)
        run: npm run tauri -- build

      - name: Verify bundled runtime and checksum installers
        id: installers
        shell: pwsh
        run: |
          npm run release:verify
          if ($LASTEXITCODE -ne 0) { throw 'Runtime verification failed' }
          python scripts/verify-installers.py
          if ($LASTEXITCODE -ne 0) { throw 'Installer payload verification failed' }
          python scripts/prepare-release-upload.py
          if ($LASTEXITCODE -ne 0) { throw 'Release asset preparation failed' }
          $assets = Get-Content release/upload/assets.json -Raw | ConvertFrom-Json
          'files<<VERIFIED_RELEASE_ASSETS' >> $env:GITHUB_OUTPUT
          $assets | ForEach-Object { "release/upload/$($_.name)" } | Add-Content $env:GITHUB_OUTPUT
          'VERIFIED_RELEASE_ASSETS' >> $env:GITHUB_OUTPUT

      - name: Check whether release already exists
        id: release_status
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME --json tagName --jq '.tagName' 2>$null
          if ($LASTEXITCODE -eq 0) { 'publish=false' >> $env:GITHUB_OUTPUT }
          else { 'publish=true' >> $env:GITHUB_OUTPUT }
          exit 0

      - name: Create GitHub Release
        if: steps.release_status.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ${{ steps.installers.outputs.files }}
